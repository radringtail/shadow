<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="Proof &bull; G.H.O.S.T.">   
    <meta property="og:url" content="https://ghost.babyfurcon.com/bond/">
    <meta property="og:image" content="https://ghost.babyfurcon.com/assets/images/ghost1.png">
    <meta property="og:type" content="website">
    
    <title>Proof &bull; G.H.O.S.T.</title>    
    <link href="../assets/packages/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/style.css" rel="stylesheet">
    <link href="../assets/images/site-icon.png" rel="icon" sizes="192x192">
    <link href="../assets/images/site-icon-apple.png" rel="apple-touch-icon">    
    <script src="../assets/packages/jquery.min.js"></script>
    <script src="../assets/packages/bootstrap.bundle.min.js"></script>
    <script src="../assets/common.js"></script>
    <script src="../assets/prints.js"></script>
</head>
<body class="scanlines bg-primary-subtle">
    <div class="container py-3 text-center">
        <div class="row">
            <div class="col-sm-10 col-md-8 col-lg-5 col-xl-4 mx-auto">
                <div class="card rounded-4 mb-4 bg-spooky" id="friendshipCert">
                    <div class="card-header bg-transparent bg-blur-dark border-bottom-2 shadow-blur">
                        G.H.O.S.T. Friendship Card
                    </div>
                    <div class="card-body">
                        <div class="row g-2 mb-2">
                            <div class="col">
                                <img src="#" class="img-fluid rounded-circle p-2 shadow-blur bg-blur-icon mb-2" id="playerIcon" width="200">
                                <div class="fs-3 shadow-blur bg-blur rounded-top-3 ghost-font" id="playerName"></div>
                                <div class="shadow-blur bg-blur-dark rounded-bottom-3">BFC Attendee</div>
                            </div>
                            <div class="col">
                                <img src="#" class="img-fluid rounded-circle p-2 bg-blur-icon shadow-blur mb-2" id="ghostIcon" width="200">
                                <div class="fs-3 bg-blur shadow-blur rounded-top-3 ghost-font" id="ghostName"></div>
                                <div class="bg-blur-dark shadow-blur rounded-bottom-3">Festival Ghost</div>
                            </div>
                        </div>
                        <div class="card rounded-3 bg-transparent bg-blur shadow-blur border-0">
                            <div class="card-body">
                                <div class="row attributeText g-2">
                                    <div class="col text-end">
                                        <p class="mb-1" id="playerAttr"></p>
                                    </div>
                                    <div class="col">
                                        <p class="mb-1">
                                            <b class="ghost-font ghost-glow">Attraction</b>
                                        </p>
                                    </div>
                                    <div class="col text-start">
                                        <p class="mb-1" id="ghostAttr"></p>
                                    </div>
                                </div>
                                <div class="row attributeText g-2">
                                    <div class="col text-end">
                                        <p class="mb-1" id="playerAura"></p>
                                    </div>
                                    <div class="col">
                                        <p class="mb-1">
                                            <b class="ghost-font ghost-glow">Aura</b>
                                        </p>
                                    </div>
                                    <div class="col text-start">
                                        <p class="mb-1" id="ghostAura"></p>
                                    </div>
                                </div>
                                <div class="row attributeText g-2">
                                    <div class="col text-end">
                                        <p class="mb-1" id="playerAffi"></p>
                                    </div>
                                    <div class="col">
                                        <p class="mb-1">
                                            <b class="ghost-font ghost-glow">Affinity</b>
                                        </p>
                                    </div>
                                    <div class="col text-start">
                                        <p class="mb-1" id="ghostAffi"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent bg-blur-dark border-top-2">
                        Babyfur Con 2026 &bull; Peek-a-BOO! Festival
                    </div>
                </div>
                <p>
                    <a href="#" id="editCard" class="btn btn-sm m-1 btn-info bg-info-subtle text-light">Edit Card</a>
                    <a href="#" id="emailLink" class="btn btn-sm m-1 btn-success bg-success-subtle">Email to G.H.O.S.T.</a>
                </p>
            </div>
        </div>
    </div>
    <div id="editCardModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">Edit Card Information</div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row row-cols-1 row-cols-md-3 mb-3">
                        <div class="col">
                            <label for="editPlayerName">Player Name</label>
                            <input id="editPlayerName" class="form-control">
                        </div>
                        <div class="col">
                            <label for="editGhostName">Ghost Name</label>
                            <input id="editGhostName" class="form-control">
                        </div>
                    </div>
                    <p class="text-center">
                        <button id="editCardButton" class="btn btn-lg btn-primary shadow">Edit Card</button>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        $(function(){
            var friendKey = localStorage.getItem("newFriend");
            if(friendKey == null) window.location.href = '../';
            friend = ghostFriends.find(x => x.key == friendKey);
            if(friend == null) window.location.href = '../';
            
            // pull all available data
            var playerName = localStorage.getItem("preferredName");
            var playerIcon = localStorage.getItem("avatarUrl");
            var playerBsky = localStorage.getItem("bskyHandle");
            var playerAttr = localStorage.getItem("playerAttr");
            var playerAura = localStorage.getItem("playerAura");
            var playerAffi = localStorage.getItem("playerAffi");
            
            var ghostName = localStorage.getItem("newFriendName");
            var ghostIcon = friend.ghost;
            var ghostAttr = friend.attr;
            var ghostAura = friend.aura;
            var ghostAffi = friend.affi;
            var ghostPrint = friend.print;
            
            var cluesFound = localStorage.getItem("cluesFound");
            var cluesFoundArray = JSON.parse(cluesFound);
            if(cluesFound == null) cluesFoundArray = [];
            
            if(playerIcon == null || playerIcon == undefined) playerIcon = 'https://cdn.bsky.app/img/avatar/plain/did:plc:56xcru5bk2bsvsgufem7bah5/bafkreidwuvaogsgwpmanxpaoofavdhulczq5gmpooptvjj6ugyodumbk44';
            if(ghostName == null || ghostName == undefined) ghostName = 'Gamma';
            
            $("#playerIcon").attr("src", playerIcon);
            $("#ghostIcon").attr("src", `../assets/ghosts/${ghostIcon}`);
            
            $("#playerName").html(playerName);
            $("#ghostName").html(ghostName);
            
            $("#playerAttr").html(playerAttr);
            $("#playerAura").html(playerAura);
            $("#playerAffi").html(playerAffi);
            $("#ghostAttr").html(ghostAttr);
            $("#ghostAura").html(ghostAura);
            $("#ghostAffi").html(ghostAffi);

            $("#editPlayerName").val(playerName);
            $("#editGhostName").val(ghostName);

            $("#editCard").on("click", function(){
                const editCardModal = new bootstrap.Modal("#editCardModal");
                editCardModal.show();
            });

            $("#editCardButton").on("click", function(){
                var editedPlayerName = $("#editPlayerName").val();
                var editedGhostName = $("#editGhostName").val();

                if(editedPlayerName != "") localStorage.setItem("preferredName", editedPlayerName);
                if(editedGhostName != "") localStorage.setItem("newFriendName", editedGhostName);

                window.location.reload();
            });
            
            const cardVars = { playerName, playerIcon, playerBsky, playerAttr, playerAura, playerAffi, ghostName, ghostAttr, ghostAura, ghostAffi, ghostPrint };
            var cardVarsString = btoa(JSON.stringify(cardVars));
            
            const emailTo = 'ghost@babyfurcon.com';
            const emailSubject = `New Friendship | ${playerName} and ${ghostName}`;
            var emailBody = 
`New Friendship Report

This email hereby certifies that I, "${playerName}":
- Collected at least 8 Peek-a-BOO! Festival stamps
- Personally located ${cluesFoundArray.length} festival ghosts for clues
- Solved the riddle of the paper ghost
- Correctly identified a mystery ghost print
- Made a genuine friendship with "${ghostName}", a newly-named festival ghost.

I am formally requesting to apply to G.H.O.S.T., using this encounter as proof of successful ghost research, contact and friendship.

Authenticity Code: ${cardVarsString}`;
            
            emailBody = emailBody.replace(/\r\n|\r|\n/g, "%0D%0A");
            
            const tempElement = document.createElement('div');
            tempElement.textContent = emailSubject;
            var encodedSubject = tempElement.innerHTML;
            
            var emailLink = `mailto:${emailTo}?subject=${encodedSubject}&body=${emailBody}`;
            $("#emailLink").attr("href", emailLink);
        })
    </script>
</body>
</html>
