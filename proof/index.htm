<script>
    $(function(){
        var friendKey = localStorage.getItem("newFriend");
        if(friendKey == null) window.location.href = '../';
        friend = ghostFriends.find(x => x.key == friendKey);
        if(friend == null) window.location.href = '../';
        localStorage.setItem("cardReceived", true);
        
        var playerName = localStorage.getItem("preferredName");
        var playerIcon = localStorage.getItem("avatarUrl");
        var playerBsky = localStorage.getItem("bskyHandle");
        var playerAttr = localStorage.getItem("playerAttr");
        var playerAura = localStorage.getItem("playerAura");
        var playerAffi = localStorage.getItem("playerAffi");
        var cardTheme = localStorage.getItem("cardTheme");
        var ghostName = localStorage.getItem("newFriendName");
        var ghostIcon = friend.ghost;
        var ghostAttr = friend.attr;
        var ghostAura = friend.aura;
        var ghostAffi = friend.affi;
        var ghostPrint = friend.print;
              
        if(playerIcon == null) playerIcon = '../assets/ghosts/ghost1.png';
        if(ghostName == null || ghostName == undefined) ghostName = 'Ghost';
        if(cardTheme == null || cardTheme == undefined){
            cardTheme = 'tot';
        }
        $("#cardFront").addClass(`bg-${cardTheme}`);        
        $("#playerIcon").attr("src", playerIcon);
        $("#ghostIcon").attr("src", `../assets/ghosts/${ghostIcon}`);        
        $("#playerName").html(playerName);
        $("#ghostName").html(ghostName);        
        $("#playerAttr").html(playerAttr);
        $("#playerAura").html(playerAura);
        $("#playerAffi").html(playerAffi);
        $("#ghostAttr").html(ghostAttr);
        $("#ghostAura").html(ghostAura);
        $("#ghostAffi").html(ghostAffi);        
        $("#editPlayerName").val(playerName);
        $("#editBskyHandle").val(playerBsky);
        $("#qual1").val(playerAttr);
        $("#qual2").val(playerAura);
        $("#qual3").val(playerAffi);
        $("#editGhostName").val(ghostName);
        $("#editCardTheme").val(cardTheme);

        if(localStorage.getItem("appliedToGHOST") != null){
            $("header").removeClass("d-none");
        }
        else{
            setTimeout(() => { $("#applyButton").removeClass("d-none"); }, 2000);
        }
        $("#cardFront").removeClass("d-none");
        setTimeout(() => { $("#editCard").removeClass("d-none"); }, 2500);

        $("#editCard").on("click", function(){
            const editCardModal = new bootstrap.Modal("#editCardModal");
            editCardModal.show();
        });
        
        $("#editCardButton").on("click", function(){
            var editedPlayerName = $("#editPlayerName").val();
            var editBskyHandle = $("#editBskyHandle").val();
            var editedPlayerAttr = $("#qual1").val();
            var editedPlayerAura = $("#qual2").val();
            var editedPlayerAffi = $("#qual3").val();
            var editedGhostName = $("#editGhostName").val();
            var editCardTheme = $("#editCardTheme").val();
            
            if(editedPlayerName != "") localStorage.setItem("preferredName", editedPlayerName);
            if(editedGhostName != "") localStorage.setItem("newFriendName", editedGhostName);
            if(editedPlayerAttr != "") localStorage.setItem("playerAttr", editedPlayerAttr);
            if(editedPlayerAura != "") localStorage.setItem("playerAura", editedPlayerAura);
            if(editedPlayerAffi != "") localStorage.setItem("playerAffi", editedPlayerAffi);
            if(editBskyHandle != "" && editBskyHandle.indexOf(".") < 0){
                editBskyHandle = editBskyHandle+'.bsky.social';
            }
            localStorage.setItem("bskyHandle", editBskyHandle);
            localStorage.setItem("cardTheme", editCardTheme);
            storeBskyData(editBskyHandle);
            
            setTimeout(() => {
                window.location.reload();
            }, 500);
        });
    })
</script>
