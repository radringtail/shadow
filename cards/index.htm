<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="Art Postcards &bull; G.H.O.S.T.">   
    <meta property="og:url" content="https://ghost.babyfurcon.com/cards/">
    <meta property="og:image" content="https://ghost.babyfurcon.com/assets/images/ghost1.png">
    <meta property="og:type" content="website">
    
    <title>Art Postcards &bull; G.H.O.S.T.</title>
    <link href="../assets/packages/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/style.css" rel="stylesheet">
    <link href="../assets/images/site-icon.png" rel="icon" sizes="192x192">
    <link href="../assets/images/site-icon-apple.png" rel="apple-touch-icon">
    <script src="../assets/packages/jquery.min.js"></script>
    <script src="../assets/packages/bootstrap.bundle.min.js"></script>
    <script src="../assets/packages/sortable.min.js"></script>
</head>
<body class="scanlines">
    <div id="ghostsGuide" class="pt-5">
        <div class="container">
            <div class="row ghost-font scanlines-text-strong">
                <div class="col-lg-10 col-xl-8 mx-auto text-center">
                    <h2 class="display-2">Art Postcards</h2>
                    <hr>
                    <p class="fs-3 pb-3 pb-md-5">
                        Below are all of the Art Postcards created for BFC 2026!
                    </p>
                    <div class="row row-cols-4 g-1 g-md-2" id="postcards">
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-01.png" class="img-fluid rounded card-hover">
                        </div>
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-02.png" class="img-fluid rounded card-hover">
                        </div>
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-03.png" class="img-fluid rounded card-hover">
                        </div>
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-04.png" class="img-fluid rounded card-hover">
                        </div>
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-05.png" class="img-fluid rounded card-hover">
                        </div>
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-06.png" class="img-fluid rounded card-hover">
                        </div>
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-07.png" class="img-fluid rounded card-hover">
                        </div>
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-08.png" class="img-fluid rounded card-hover">
                        </div>
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-09.png" class="img-fluid rounded card-hover">
                        </div>
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-10.png" class="img-fluid rounded card-hover">
                        </div>
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-11.png" class="img-fluid rounded card-hover">
                        </div>
                        <div class="col shadow-sm">
                            <img src="../assets/cards/back-12.png" class="img-fluid rounded card-hover">
                        </div>
                    </div>                    
                </div>
            </div>
        </div>
        <footer class="site-footer py-4 mt-5 text-center">
            <div class="container">
                <p class="my-2">
                    <a href="../" class="link-light">Back to G.H.O.S.T. Home Page</a>
                </p>
            </div>
        </footer>
    </div>
    <script>
        var cards = document.querySelector('#postcards');
        for (var i = cards.children.length; i >= 0; i--) {
            cards.appendChild(cards.children[Math.random() * i | 0]);
        }        
        new Sortable(postcards, { swap: true, swapClass: 'card-swap', animation: 150 });
    </script>
</body>
</html>
