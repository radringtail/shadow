<body class="scanlines">
    <div id="ghostsGuide" class="pt-5">
        <div class="container">

                </div>
            </div>
            <div class="row row-cols-4 g-1" id="postcards">
                <div class="col">
                    <img src="../assets/cards/back-01.png" class="img-fluid rounded card-hover">
                </div>
                <div class="col">
                    <img src="../assets/cards/back-02.png" class="img-fluid rounded card-hover">

                <div class="col">

                <div class="col">

                <div class="col">

                    <a href="../" class="link-light">Back to G.H.O.S.T. Home Page</a>
                </p>
            </div>
        </footer>

    <script>
        var cards = document.querySelector('#postcards');
        for (var i = cards.children.length; i >= 0; i--) {
            cards.appendChild(cards.children[Math.random() * i | 0]);
        }

        new Sortable(postcards, {
            swap: true,
            swapClass: 'card-swap',
            animation: 150
        });
    </script>
