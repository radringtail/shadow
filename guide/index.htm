<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="Ghost Guide &bull; G.H.O.S.T.">   
    <meta property="og:url" content="https://ghost.babyfurcon.com/guide/">
    <meta property="og:image" content="https://ghost.babyfurcon.com/assets/images/ghost1.png">
    <meta property="og:type" content="website">
    
    <title>Ghost Guide &bull; G.H.O.S.T.</title>    
    <link href="../assets/packages/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/style.css" rel="stylesheet">
    <link href="../assets/images/site-icon.png" rel="icon" sizes="192x192">
    <link href="../assets/images/site-icon-apple.png" rel="apple-touch-icon">
    <script src="../assets/packages/jquery.min.js"></script>
    <script src="../assets/packages/bootstrap.bundle.min.js"></script>
    <script src="../assets/packages/vue.min.js"></script>
    <script src="../assets/ghosts.js"></script>
</head>
<body class="scanlines bg-primary-subtle">
    <div id="ghostsGuide" class="py-5">
        <div class="container">
            <div class="row">
                <div class="col-sm-7 mx-auto mb-5 text-center">
                    <h2 class="display-2 scanlines-text-strong">Ghost Guide</h2>
                    <hr class="border border-2 opacity-100 border-primary-subtle">
                    <p class="fs-3 ghost-font">
                        Welcome <span class="scanlines-text-strong">Seeker</span>! Having troubles with the signs? No problem! We've brought the signs to you!
                    </p>
                    <p class="fs-5">
                        Click on any sign below to scan for the same ghosts as on the physical signs. They'll join your <span class="scanlines-text-strong">Locator</span> and help you just as much as anyone else.
                    </p>
                    <p>
                        <a href="../" class="btn btn-outline-light border-light-subtle btn-sm">Back to Home</a>
                    </p>
                </div>
            </div>
            <div class="row row-cols-3 row-cols-md-4 row-cols-xl-5 row-cols-xxl-6 text-center g-2 g-sm-3 g-lg-4 justify-content-center">
                <div class="col" v-for="ghost in cluesData">
                    <div class="card h-100 bg-body-tertiary shadow-sm">
                        <a :href="`../ghost/index.htm?key=${ghost.key}`" target="_blank"><img :src="`../assets/signs/${ghost.slug}.jpg`" class="card-img-top shadow sign-thumb mb-3"></a>
                        <p>
                            <a :href="`../ghost/index.htm?key=${ghost.key}`" target="_blank" class="link-light link-underline-opacity-0 link-underline-opacity-100-hover">{{ghost.sign}}</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>    
    <script>
        var app = new Vue({
            el: "#ghostsGuide",
            data: {
                search: '',
                ghostClues: ghostData
            },
            computed: {
                cluesData() {
                    return this.ghostClues
                    .sort((a, b) => (a.sign > b.sign) ? 1 : -1)
                }
            },
            methods: {
                filteredClues() {
                    return this.ghostClues.slice()
                    .filter(x => { 
                        return x.sign.toLowerCase().indexOf(this.sign.toLowerCase()) > -1
                    })
                    .sort((a, b) => (a.sign > b.sign) ? 1 : -1)
                }
            }
        });
    </script>
</body>
</html>
