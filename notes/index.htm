    <div id="ghostsGuide" class="pt-5">

                <div class="col" v-for="ghost in foundClues">
                    <div class="card h-100 bg-body-tertiary shadow-sm">
                        <img :src="`../assets/signs/${ghost.slug}.jpg`" class="card-img-top shadow sign-thumb mb-3">
                        <div class="card-body">
                            <p>
                                <span v-html="ghost.clue"></span>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <footer class="site-footer py-4 mt-5 text-center">

                    <a href="../" class="link-light">Back to G.H.O.S.T. Home Page</a>
                </p>
            </div>
        </footer>
    </div>
        <script>

        var cluesFoundArray = JSON.parse(cluesFound);
        if(cluesFound == null) cluesFoundArray = [];

                    })
