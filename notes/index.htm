<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="Field Notes &bull; G.H.O.S.T.">   
    <meta property="og:url" content="https://ghost.babyfurcon.com/notes/">
    <meta property="og:image" content="https://ghost.babyfurcon.com/assets/images/ghost1.png">
    <meta property="og:type" content="website">
    
    <title>Field Notes &bull; G.H.O.S.T.</title>    
    <link href="../assets/packages/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/style.css" rel="stylesheet">
    <link href="../assets/images/site-icon.png" rel="icon" sizes="192x192">
    <link href="../assets/images/site-icon-apple.png" rel="apple-touch-icon">
    <script src="../assets/packages/jquery.min.js"></script>
    <script src="../assets/packages/bootstrap.bundle.min.js"></script>
    <script src="../assets/packages/vue.min.js"></script>
    <script src="../assets/ghosts.js"></script>
</head>
<body class="scanlines bg-danger-subtle">
    <div id="ghostsGuide" class="pt-5">
        <div class="container">
            <div class="row mb-5">
                <div class="col-sm-8 mx-auto text-center">
                    <h2 class="display-2 ghost-font scanlines-text-strong">Field Notes</h2>
                    <hr class="border border-2 opacity-100 border-orange">
                    <p class="fs-5 ghost-font">
                        Good job <span class="scanlines-text-strong">Seeker</span>! Here's all the ghosts you've found and talked to.
                    </p>
                    <p>
                        <a href="../" class="btn btn-outline-light border-light-subtle btn-sm">Back to Home</a>
                    </p>
                </div>
            </div>
            <div class="row row-cols-1 row-cols-lg-2 row-cols-xxl-3 g-3 g-lg-4 justify-content-center">
                <div class="col" v-for="ghost in foundClues">
                    <div class="card h-100 bg-dark shadow">
                        <div class="row g-0">
                            <div class="col-3">
                                <div class="square-image my-3">
                                    <img :src="`../assets/signs/${ghost.slug}.jpg`" class="img-fluid rounded-3 shadow-sm">
                                </div>
                            </div>
                            <div class="col-9">
                                <div class="card-body">
                                    <h2 class="h3 card-title ghost-font">{{ghost.sign}}</h2>
                                    <p class="card-text lead highlight lh-sm">"<span v-html="ghost.clue"></span>"</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="alert alert-danger text-center" v-if="foundClues.length == 0">No ghosts discovered.</div>
        </div>
    </div>
    <script>
        var cluesFound = localStorage.getItem("cluesFound");
        var cluesFoundArray = JSON.parse(cluesFound);
        if(cluesFound == null) cluesFoundArray = [];
        var app = new Vue({
            el: "#ghostsGuide",
            data: {
                search: '',
                ghostClues: ghostData
            },
            computed: {
                foundClues() {
                    return cluesFoundArray.reverse()
                        .map(key => this.ghostClues.find(x => x.key == key))
                        .filter(x => x !== undefined);
                }
            }
        });
    </script>
</body>
</html>
