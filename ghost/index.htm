<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="robots" content="noindex, nofollow">

    <meta property="og:url" content="https://ghost.babyfurcon.com/ghost/">

    <meta property="og:type" content="website">

    <title>Festival Ghost &bull; G.H.O.S.T.</title>
    <link href="../assets/packages/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/style.css" rel="stylesheet">
    <link href="../assets/images/site-icon.png" rel="icon" sizes="192x192">
    <link href="../assets/images/site-icon-apple.png" rel="apple-touch-icon">
    <script src="../assets/packages/jquery.min.js"></script>
    <script src="../assets/packages/bootstrap.bundle.min.js"></script>
    <script src="../assets/common.js"></script>
    <script src="../assets/ghosts.js"></script>

<body class="scanlines">
    <div class="container py-5">
        <div class="row text-center">
            <div class="col-md-6 mx-auto">
                <div id="gutter" class="px-3">
                    <p class="sway">
                        <img src="../assets/ghosts/ghost1.png" width="300" class="img-fluid blur-in" id="ghostSpeaker">
                    </p>
                    <h1 class="ghost-glow mb-5 blur-in" id="ghostMessage">
                        "<span id="ghostClue"></span>"
                    </h1>
                    <div class="btn btn-outline-secondary btn-lg ghost-glow blur-in" id="closeButton">Depart</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function () {
            $("#closeButton").on("click", function () {
                window.close();
            });

            const params = new Proxy(new URLSearchParams(window.location.search), {
                get: (searchParams, prop) => searchParams.get(prop),
            });
            var ghostKey = params.key;
            foundGhost = ghostData.find(x => x.key === ghostKey);
            if (foundGhost == null || foundGhost == undefined) {
                $("#ghostClue").html("Hello? Who is this? Ah, must be a wrong number. Sorry!");
                return;
            }

            $("#ghostClue").html(foundGhost.clue);
            if (foundGhost.ghost != "") {
                $("#ghostSpeaker").attr("src", `../assets/ghosts/${foundGhost.ghost}`);
            }

            updateStoredClues(ghostKey);
        })

        function updateStoredClues(newClue) {
            if (newClue == null) return;

            var cluesFound = localStorage.getItem("cluesFound");
            var cluesFoundArray = JSON.parse(cluesFound);
            if (cluesFound == null) cluesFoundArray = [];

            if (!cluesFoundArray.find(x => x == newClue)) {
                cluesFoundArray.push(newClue);
                var cluesFoundJson = JSON.stringify(cluesFoundArray);
                localStorage.setItem("cluesFound", cluesFoundJson);
            }
        }
    </script>
</body>

</html>
